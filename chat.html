<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — Ademir Meira Advocacia</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ece5d8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-container {
      display: flex;
      height: 100vh;
      gap: 0;
    }

    /* Sidebar */
    .chat-sidebar {
      width: 340px;
      background: #f7f5f0;
      border-right: 1px solid #d4cec1;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 8px rgba(0,0,0,0.05);
    }

    .sidebar-header {
      padding: 16px;
      background: #2c3e50;
      color: white;
      font-weight: bold;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .conversa-item {
      padding: 14px 16px;
      border-bottom: 1px solid #e7e2d6;
      cursor: pointer;
      transition: background 0.2s;
      text-align: left;
      background: none;
      border: none;
      width: 100%;
      font-size: 0.9rem;
    }

    .conversa-item:hover {
      background: #efeade;
    }

    .conversa-item.ativo {
      background: #e6ddc8;
      border-left: 4px solid #667eea;
    }

    .conversa-nome {
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 4px;
    }

    .conversa-preview {
      color: #888;
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversa-time {
      color: #aaa;
      font-size: 0.75rem;
      text-align: right;
      margin-top: 4px;
    }

    .sidebar-novo {
      padding: 12px 16px;
      border-top: 1px solid #d4cec1;
      background: white;
    }

    .btn-novo {
      width: 100%;
      background: #667eea;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .btn-novo:hover {
      background: #764ba2;
    }

    /* Main Chat Area */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ece5d8;
    }

    .chat-header {
      padding: 16px 24px;
      background: white;
      border-bottom: 1px solid #d4cec1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .chat-header h2 {
      font-size: 1.1rem;
      color: #2c3e50;
      margin: 0;
    }

    .chat-header small {
      color: #999;
      font-size: 0.85rem;
    }

    .chat-info {
      text-align: left;
    }

    .chat-status {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 0.8rem;
      color: #10b981;
      margin-top: 4px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
    }

    /* Messages Area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bolha {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bolha-user {
      align-self: flex-end;
      background: #dcf8c6;
      color: #000;
      border-bottom-right-radius: 2px;
    }

    .bolha-agente {
      align-self: flex-start;
      background: #e5e5ea;
      color: #000;
      border-bottom-left-radius: 2px;
    }

    .bolha-tiempo {
      font-size: 0.75rem;
      color: #999;
      margin-top: 4px;
      text-align: right;
    }

    .bolha-agente .bolha-tiempo {
      text-align: left;
    }

    .carregando {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .carregando span {
      width: 8px;
      height: 8px;
      background: #999;
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }

    .carregando span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .carregando span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 40px 20px;
      font-style: italic;
    }

    /* Input Area */
    .chat-input-area {
      padding: 16px 24px;
      background: white;
      border-top: 1px solid #d4cec1;
      display: flex;
      gap: 12px;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #d4cec1;
      border-radius: 20px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      max-height: 80px;
      outline: none;
      transition: border-color 0.3s;
    }

    #messageInput:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn-enviar {
      background: #667eea;
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: background 0.3s;
      flex-shrink: 0;
    }

    .btn-enviar:hover:not(:disabled) {
      background: #764ba2;
    }

    .btn-enviar:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .aviso {
      background: #fff3cd;
      color: #856404;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      border-left: 4px solid #ffc107;
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      .chat-sidebar {
        width: 280px;
      }

      .bolha {
        max-width: 85%;
      }
    }

    @media (max-width: 600px) {
      .chat-container {
        flex-direction: column;
      }

      .chat-sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid #d4cec1;
        max-height: 100px;
      }

      .sidebar-list {
        display: none;
      }

      .chat-messages {
        padding: 12px 16px;
      }

      .chat-input-area {
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>

  <div class="chat-container">

    <!-- Sidebar -->
    <div class="chat-sidebar">
      <div class="sidebar-header">💬 Conversas</div>
      <div class="sidebar-list" id="conversasList">
        <div style="padding: 20px; text-align: center; color: #999;">
          Carregando conversas...
        </div>
      </div>
      <div class="sidebar-novo">
        <button class="btn-novo" onclick="novaConversa()">+ Nova Conversa</button>
      </div>
    </div>

    <!-- Chat Main -->
    <div class="chat-main">
      <div class="chat-header">
        <div class="chat-info">
          <h2 id="chatNome">Selecione uma conversa</h2>
          <small id="chatDescricao">—</small>
          <div class="chat-status">
            <span class="status-dot"></span>
            <span id="chatStatus">Conectado</span>
          </div>
        </div>
      </div>

      <div class="chat-messages" id="mensagensArea">
        <div class="empty-state">Selecione uma conversa para começar</div>
      </div>

      <div class="chat-input-area">
        <div class="aviso" id="avisoArea" style="display: none; width: 100%; margin-bottom: 0;">
          ⚠️ <span id="avisoTexto"></span>
        </div>
        <div class="input-wrapper" id="inputWrapper" style="display: none;">
          <textarea
            id="messageInput"
            placeholder="Digite sua mensagem..."
            rows="1"
          ></textarea>
          <button class="btn-enviar" id="btnEnviar" onclick="enviarMensagem()">📤</button>
        </div>
      </div>
    </div>

  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    let sb = null;
    let conversaAtualId = null;
    let usuarioId = null;
    let todasConversas = [];

    const MODELOS_OLLAMA = [
      'neural-chat',
      'mistral',
      'orca-mini',
      'tinyllama'
    ];

    // Inicializar
    async function inicializar() {
      try {
        if (!window.APP_CONFIG) {
          mostrarAviso('config.js não encontrado');
          return;
        }

        sb = supabase.createClient(
          window.APP_CONFIG.SUPABASE_URL,
          window.APP_CONFIG.SUPABASE_KEY
        );

        // Criar ou obter usuário de teste
        const { data: usuarios, error: e1 } = await sb
          .from('usuarios_whatsapp')
          .select('id')
          .limit(1);

        if (e1 || !usuarios || usuarios.length === 0) {
          mostrarAviso('Nenhum usuário encontrado. Crie um primeiro no dashboard.');
          return;
        }

        usuarioId = usuarios[0].id;
        await carregarConversas();

      } catch (erro) {
        console.error('Erro ao inicializar:', erro);
        mostrarAviso('Erro: ' + erro.message);
      }
    }

    async function carregarConversas() {
      try {
        const { data, error } = await sb
          .from('conversas')
          .select('*')
          .eq('usuario_id', usuarioId)
          .order('updated_at', { ascending: false });

        if (error) throw error;

        todasConversas = data || [];
        const lista = document.getElementById('conversasList');

        if (todasConversas.length === 0) {
          lista.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">Nenhuma conversa</div>';
          return;
        }

        lista.innerHTML = todasConversas.map(c => `
          <button class="conversa-item ${c.id === conversaAtualId ? 'ativo' : ''}" onclick="selecionarConversa('${c.id}', '${c.assunto}')">
            <div class="conversa-nome">${c.assunto || 'Sem assunto'}</div>
            <div class="conversa-preview">${c.ultima_mensagem || 'Clique para abrir'}</div>
            <div class="conversa-time">${new Date(c.updated_at).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'})}</div>
          </button>
        `).join('');

      } catch (erro) {
        console.error('Erro ao carregar conversas:', erro);
      }
    }

    async function selecionarConversa(id, assunto) {
      conversaAtualId = id;
      document.getElementById('chatNome').textContent = assunto || 'Conversa';
      document.getElementById('inputWrapper').style.display = 'flex';
      document.getElementById('avisoArea').style.display = 'none';

      // Recarregar lista para destacar a conversa ativa
      await carregarConversas();

      // Carregar mensagens
      await carregarMensagens();
    }

    async function carregarMensagens() {
      try {
        const { data: mensagens, error } = await sb
          .from('mensagens_operador')
          .select('*')
          .eq('conversa_id', conversaAtualId)
          .order('created_at', { ascending: true });

        if (error) throw error;

        const area = document.getElementById('mensagensArea');

        if (!mensagens || mensagens.length === 0) {
          area.innerHTML = '<div class="empty-state">Nenhuma mensagem ainda. Comece a conversa!</div>';
          return;
        }

        area.innerHTML = mensagens.map(m => `
          <div class="bolha bolha-${m.tipo === 'usuario' ? 'user' : 'agente'}">
            <strong>${m.usuario_operador || 'Você'}</strong><br>
            ${m.texto}
            <div class="bolha-tiempo">${new Date(m.created_at).toLocaleTimeString('pt-BR')}</div>
          </div>
        `).join('');

        // Scroll para o final
        area.scrollTop = area.scrollHeight;

      } catch (erro) {
        console.error('Erro ao carregar mensagens:', erro);
      }
    }

    async function enviarMensagem() {
      const input = document.getElementById('messageInput');
      const texto = input.value.trim();

      if (!texto) return;
      if (!conversaAtualId) return;

      // Limpar input
      input.value = '';
      input.style.height = 'auto';

      // Salvar mensagem do usuário
      try {
        await sb.from('mensagens_operador').insert({
          conversa_id: conversaAtualId,
          usuario_operador: 'Cliente',
          texto: texto,
          tipo: 'usuario',
          lida: false
        });

        await carregarMensagens();

        // Simular digitação do agente
        mostrarDigitacao();

        // Gerar resposta (após delay)
        setTimeout(async () => {
          const resposta = await gerarResposta(texto);

          await sb.from('mensagens_operador').insert({
            conversa_id: conversaAtualId,
            usuario_operador: 'Agente Jurídico (IA)',
            texto: resposta,
            tipo: 'agente',
            lida: true
          });

          await carregarMensagens();

          // Atualizar última mensagem da conversa
          await sb
            .from('conversas')
            .update({
              ultima_mensagem: resposta,
              updated_at: new Date().toISOString()
            })
            .eq('id', conversaAtualId);

          await carregarConversas();

        }, 1500 + Math.random() * 1500);

      } catch (erro) {
        console.error('Erro ao enviar mensagem:', erro);
        mostrarAviso('Erro ao salvar: ' + erro.message);
      }
    }

    function mostrarDigitacao() {
      const area = document.getElementById('mensagensArea');
      const bolha = document.createElement('div');
      bolha.className = 'bolha bolha-agente';
      bolha.innerHTML = '<div class="carregando"><span></span><span></span><span></span></div>';
      bolha.id = 'digitacao';
      area.appendChild(bolha);
      area.scrollTop = area.scrollHeight;
    }

    async function gerarResposta(mensagem) {
      // Tentar Ollama primeiro
      try {
        const resposta = await fetch('http://localhost:11434/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'neural-chat',
            prompt: `Você é um assistente jurídico. Responda de forma breve e útil em português. Mensagem do cliente: "${mensagem}"`,
            stream: false,
            temperature: 0.7
          })
        });

        if (resposta.ok) {
          const data = await resposta.json();
          return data.response.substring(0, 500).trim();
        }
      } catch (e) {
        console.log('Ollama não disponível, usando resposta mock');
      }

      // Fallback: respostas mock simulando IA fraca
      return gerarRespostaMock(mensagem);
    }

    function gerarRespostaMock(mensagem) {
      const respostas = [
        'Obrigado pela sua mensagem. Poderia fornecer mais detalhes sobre seu caso?',
        'Entendi. Este é um assunto importante. Recomendo agendar uma consulta com um de nossos advogados.',
        'Baseado no que você descreveu, você pode ter direitos nesta situação.',
        'Essa questão requer análise jurídica mais profunda. Vou encaminhar para nosso especialista.',
        'Sim, existem precedentes similares. Precisamos revisar sua documentação.',
        'Compreendo sua preocupação. Este tipo de caso geralmente é resolvido em X dias.',
        'Você está no caminho certo. Qual é o próximo passo que deseja dar?',
        'Agradeço a confiança. Vamos trabalhar juntos para resolver isso.',
      ];

      return respostas[Math.floor(Math.random() * respostas.length)];
    }

    async function novaConversa() {
      const assunto = prompt('Qual é o assunto da conversa?', 'Nova Consulta');
      if (!assunto) return;

      try {
        const { data, error } = await sb
          .from('conversas')
          .insert({
            usuario_id: usuarioId,
            assunto: assunto,
            status: 'ativa',
            ultima_mensagem: 'Conversa iniciada',
            contador_mensagens: 0
          })
          .select();

        if (error) throw error;

        if (data && data[0]) {
          await selecionarConversa(data[0].id, assunto);
        }

      } catch (erro) {
        console.error('Erro ao criar conversa:', erro);
        mostrarAviso('Erro: ' + erro.message);
      }
    }

    function mostrarAviso(msg) {
      const avisoArea = document.getElementById('avisoArea');
      document.getElementById('avisoTexto').textContent = msg;
      avisoArea.style.display = 'block';
      document.getElementById('inputWrapper').style.display = 'none';
    }

    // Auto-resize textarea
    document.addEventListener('DOMContentLoaded', () => {
      const textarea = document.getElementById('messageInput');
      textarea?.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 80) + 'px';
      });

      // Enviar com Enter
      textarea?.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          enviarMensagem();
        }
      });

      inicializar();
    });
  </script>

</body>
</html>
